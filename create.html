<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create User - 9jaCash Admin</title>

<!-- Firebase v8 Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- Firebase Config & Helper -->
<script src="firebase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .input-field{background:#f8fafc;border-color:#e2e8f0;color:#1e293b;}
body.light-mode .input-field:focus{border-color:#6366f1;background:#fff;}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .submit-btn:disabled{background:#e2e8f0;color:#94a3b8;}
body.light-mode .theme-toggle{color:#64748b;}
body.light-mode .flow-badge{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;}
body.light-mode .input-label{color:#64748b;}
body.light-mode .footer-text{color:#94a3b8;}
body.light-mode .form-title,body.light-mode .list-title{color:#1e293b;}
body.light-mode .admin-item{background:#f8fafc;border-color:#e2e8f0;}
body.light-mode .admin-name{color:#1e293b;}
body.light-mode .admin-meta{color:#64748b;}
body.light-mode .pass-text{background:#fff;border-color:#e2e8f0;color:#334155;}
body.light-mode .count-pill{background:#eef2ff;color:#6366f1;}
body.light-mode .icon-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.back-btn:active{transform:scale(0.92);}
.header-title{font-size:18px;font-weight:800;color:#f8fafc;transition:color 0.3s;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.flow-badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #334155;border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:16px;}
.flow-badge i{font-size:12px;color:#6366f1;}

.form-header{text-align:center;padding:10px 0 20px;}
.form-title{font-size:24px;font-weight:900;color:#f8fafc;letter-spacing:-0.5px;transition:color 0.3s;}
.form-subtitle{font-size:13px;color:#64748b;margin-top:6px;font-weight:500;}

.card{background:#1e293b;border-radius:24px;padding:24px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,0.2);margin-bottom:16px;transition:all 0.3s ease;}

.input-group{margin-bottom:18px;}
.input-label{display:block;font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.input-wrapper{position:relative;display:flex;align-items:center;}
.input-icon{position:absolute;left:16px;color:#64748b;font-size:15px;pointer-events:none;transition:color 0.3s;}
.input-field{width:100%;padding:14px 16px 14px 44px;background:#0f172a;border:1px solid #334155;border-radius:14px;color:#f8fafc;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;outline:none;transition:all 0.3s;}
.input-field:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
.input-field:focus + .input-icon{color:#6366f1;}

.toggle-password{position:absolute;right:16px;color:#64748b;font-size:14px;cursor:pointer;background:none;border:none;padding:0;}
.toggle-password:hover{color:#818cf8;}

.submit-btn{width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(99,102,241,0.3);position:relative;overflow:hidden;margin-top:8px;}
.submit-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:0.5s;}
.submit-btn:hover::before{left:100%;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,0.4);}
.submit-btn:active{transform:scale(0.97);}
.submit-btn:disabled{background:#1e293b;color:#64748b;box-shadow:none;cursor:not-allowed;border:1px solid #334155;}
.submit-btn:disabled::before{display:none;}

/* ===== Created admins list ===== */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.list-title{font-size:18px;font-weight:800;color:#f8fafc;display:flex;align-items:center;gap:10px;}
.count-pill{background:rgba(99,102,241,0.18);color:#a5b4fc;font-size:12px;font-weight:800;padding:3px 10px;border-radius:50px;}
.icon-btn{width:38px;height:38px;border-radius:12px;background:#0f172a;border:1px solid #334155;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.icon-btn:hover{color:#818cf8;border-color:#6366f1;}
.list-search{margin-bottom:14px;}
.admin-item{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.admin-top{display:flex;align-items:center;gap:12px;}
.admin-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.admin-name{font-size:14px;font-weight:800;color:#f8fafc;word-break:break-word;}
.admin-meta{font-size:12px;color:#94a3b8;font-weight:500;margin-top:2px;word-break:break-all;}
.admin-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.pass-text{flex:1;min-width:0;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px 10px;font-family:monospace;font-size:12px;color:#cbd5e1;word-break:break-all;}
.list-empty{text-align:center;color:#64748b;font-size:13px;font-weight:600;padding:24px 8px;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;transition:color 0.3s;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

.anim{animation:slideUp 0.6s ease both;}
.d1{animation-delay:0.1s;}
.d2{animation-delay:0.2s;}
.d3{animation-delay:0.3s;}
.d4{animation-delay:0.4s;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

<div class="topbar anim d1">
  <button class="back-btn" onclick="goBack()">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">Admin Management</div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fa-solid fa-sun" id="themeIcon"></i>
  </button>
</div>

<div class="anim d1" style="text-align:center;">
  <div class="flow-badge">
    <i class="fa-solid fa-user-plus"></i> <span>User Management</span>
  </div>
</div>

<div class="form-header anim d1">
  <div class="form-title">Create New User</div>
  <div class="form-subtitle">Register user account and store login credentials in Admin collection</div>
</div>

<div class="card anim d2">
  <form id="createUserForm" onsubmit="handleCreateUser(event)">
    <div class="input-group">
      <label class="input-label" for="userName">Full Name</label>
      <div class="input-wrapper">
        <input type="text" id="userName" class="input-field" placeholder="Enter full name" required />
        <i class="fa-solid fa-user input-icon"></i>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="userPhone">Phone Number</label>
      <div class="input-wrapper">
        <input type="tel" id="userPhone" class="input-field" placeholder="e.g. 08012345678" required />
        <i class="fa-solid fa-phone input-icon"></i>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="userEmail">Email Address</label>
      <div class="input-wrapper">
        <input type="email" id="userEmail" class="input-field" placeholder="user@example.com" required />
        <i class="fa-solid fa-envelope input-icon"></i>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="userPassword">Password</label>
      <div class="input-wrapper">
        <input type="password" id="userPassword" class="input-field" placeholder="Enter strong password" required minlength="6" />
        <i class="fa-solid fa-lock input-icon"></i>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('userPassword', 'passIcon')">
          <i class="fa-solid fa-eye" id="passIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn anim d3" id="submitBtn">
      <i class="fa-solid fa-user-check"></i> Create User Account
    </button>
  </form>
</div>

<!-- CREATED ADMINS -->
<div class="card anim d3">
  <div class="list-head">
    <div class="list-title"><i class="fa-solid fa-users-gear" style="color:#6366f1;"></i> Created Admins <span class="count-pill" id="adminCount">0</span></div>
    <button type="button" class="icon-btn" onclick="startAdminListener()" title="Reload list"><i class="fa-solid fa-rotate"></i></button>
  </div>
  <div class="input-wrapper list-search">
    <input type="text" id="adminSearch" class="input-field" placeholder="Search name, email or phone" oninput="renderAdmins()" />
    <i class="fa-solid fa-magnifying-glass input-icon"></i>
  </div>
  <div id="adminList"><div class="list-empty">Loading admins...</div></div>
</div>

<div class="footer anim d4">
  <div class="footer-text">9jaCash 2026 • Admin Portal</div>
</div>

</div>

<script>
// ========== GET FIRESTORE DB ==========
function getDb() {
  if (window._9jaCash && window._9jaCash.db) return window._9jaCash.db;
  if (window.db) return window.db;
  if (window.firebase && window.firebase.firestore) return window.firebase.firestore();
  return null;
}

// ========== GET FIREBASE AUTH ==========
function getAuth() {
  if (window._9jaCash && window._9jaCash.auth) return window._9jaCash.auth;
  if (window.auth) return window.auth;
  if (window.firebase && window.firebase.auth) return window.firebase.auth();
  return null;
}

// ========== THEME MANAGEMENT ==========
function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

function goBack() {
  window.history.back();
}

function togglePasswordVisibility(fieldId, iconId) {
  const field = document.getElementById(fieldId);
  const icon = document.getElementById(iconId);
  if (field.type === "password") {
    field.type = "text";
    icon.className = "fa-solid fa-eye-slash";
  } else {
    field.type = "password";
    icon.className = "fa-solid fa-eye";
  }
}

// ========== VIEW CREATED ADMINS (admin/login document) ==========
let adminsData = [];
let adminUnsub = null;
const revealed = new Set();

function escapeHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function formatTs(ts) {
  try {
    const d = ts && typeof ts.toDate === "function" ? ts.toDate() : (ts ? new Date(ts) : null);
    return d && !isNaN(d) ? d.toLocaleString() : "";
  } catch (e) { return ""; }
}

function startAdminListener() {
  const db = getDb();
  const list = document.getElementById("adminList");
  if (!db) {
    list.innerHTML = '<div class="list-empty">Firebase is not initialized. Make sure firebase.js is in the same folder.</div>';
    return;
  }
  if (adminUnsub) { adminUnsub(); adminUnsub = null; }

  // Live updates: new admins appear immediately after creation
  adminUnsub = db.collection("admin").doc("login").onSnapshot(snap => {
    const rows = [];
    if (snap.exists) {
      const data = snap.data() || {};
      Object.keys(data).forEach(key => {
        const v = data[key];
        if (v && typeof v === "object" && !Array.isArray(v) && typeof v.toDate !== "function" &&
            (v.email !== undefined || v.password !== undefined)) {
          rows.push({ id: key, name: v.name || "", phone: v.phone || "", email: v.email || "", password: v.password || "", updatedAt: v.updatedAt });
        }
      });
      // also show a plain top-level email/password entry if present
      if (data.email !== undefined || data.password !== undefined) {
        rows.push({ id: "login", name: data.name || "", phone: data.phone || "", email: data.email || "", password: data.password || "", updatedAt: data.updatedAt });
      }
    }
    rows.sort((a, b) => {
      const ta = a.updatedAt && a.updatedAt.toMillis ? a.updatedAt.toMillis() : 0;
      const tb = b.updatedAt && b.updatedAt.toMillis ? b.updatedAt.toMillis() : 0;
      return tb - ta;
    });
    adminsData = rows;
    renderAdmins();
  }, err => {
    console.error("Admin list error:", err);
    list.innerHTML = '<div class="list-empty">Could not load admins: ' + escapeHtml(err.message) + '</div>';
  });
}

function renderAdmins() {
  const list = document.getElementById("adminList");
  const q = (document.getElementById("adminSearch").value || "").trim().toLowerCase();
  document.getElementById("adminCount").textContent = adminsData.length;

  const rows = adminsData.filter(a =>
    !q || [a.name, a.email, a.phone].some(x => String(x).toLowerCase().includes(q)));

  if (!rows.length) {
    list.innerHTML = '<div class="list-empty">' + (adminsData.length ? "No admins match your search." : "No admins created yet.") + '</div>';
    return;
  }

  list.innerHTML = rows.map(a => {
    const shown = revealed.has(a.id);
    const initial = escapeHtml((a.name || a.email || "?").trim().charAt(0).toUpperCase());
    const when = formatTs(a.updatedAt);
    return `
      <div class="admin-item">
        <div class="admin-top">
          <div class="admin-avatar">${initial}</div>
          <div style="min-width:0;">
            <div class="admin-name">${escapeHtml(a.name || "(no name)")}</div>
            <div class="admin-meta"><i class="fa-solid fa-envelope"></i> ${escapeHtml(a.email)}</div>
            ${a.phone ? `<div class="admin-meta"><i class="fa-solid fa-phone"></i> ${escapeHtml(a.phone)}</div>` : ""}
            ${when ? `<div class="admin-meta"><i class="fa-regular fa-clock"></i> ${escapeHtml(when)}</div>` : ""}
          </div>
        </div>
        <div class="admin-row">
          <div class="pass-text">${shown ? escapeHtml(a.password) : "••••••••"}</div>
          <button type="button" class="icon-btn" title="${shown ? "Hide" : "Show"} password" onclick="toggleReveal('${escapeHtml(a.id)}')">
            <i class="fa-solid ${shown ? "fa-eye-slash" : "fa-eye"}"></i>
          </button>
          <button type="button" class="icon-btn" title="Copy email" onclick="copyText('${escapeHtml(a.id)}','email')">
            <i class="fa-solid fa-copy"></i>
          </button>
        </div>
      </div>`;
  }).join("");
}

function toggleReveal(id) {
  if (revealed.has(id)) revealed.delete(id); else revealed.add(id);
  renderAdmins();
}

function copyText(id, field) {
  const a = adminsData.find(x => x.id === id);
  if (!a) return;
  const text = a[field] || "";
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => Swal.fire({ toast: true, position: "top", icon: "success", title: "Copied", showConfirmButton: false, timer: 1200 }))
    .catch(() => Swal.fire({ toast: true, position: "top", icon: "error", title: "Copy failed", showConfirmButton: false, timer: 1500 }));
}

// ========== HANDLE CREATE USER ==========
async function handleCreateUser(event) {
  event.preventDefault();

  const name = document.getElementById("userName").value.trim();
  const phone = document.getElementById("userPhone").value.trim();
  const email = document.getElementById("userEmail").value.trim();
  const password = document.getElementById("userPassword").value;

  if (!name || !phone || !email || !password) {
    Swal.fire({
      icon: "error",
      title: "Missing Information",
      text: "Please fill in all required fields.",
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating User...';

  const db = getDb();
  const auth = getAuth();

  if (!db || !auth) {
    Swal.fire({
      icon: "error",
      title: "System Error",
      text: "Firebase service is not initialized. Please refresh and try again.",
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Create User Account';
    return;
  }

  try {
    // 1. Create User in Firebase Auth
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
    const user = userCredential.user;
    const uid = user.uid;

    const serverTimestamp = firebase.firestore.FieldValue 
      ? firebase.firestore.FieldValue.serverTimestamp() 
      : new Date();

    // 2. Save User Document in Firestore `users` collection
    await db.collection("users").doc(uid).set({
      uid: uid,
      name: name,
      phone: phone,
      email: email,
      createdAt: serverTimestamp,
      role: "user",
      status: "active"
    });

    // 3. Save email and password to `login` document under `admin` collection
    // Saves into collection "admin", document "login", setting or updating entry by UID/Email
    await db.collection("admin").doc("login").set({
      [uid]: {
        email: email,
        password: password,
        name: name,
        phone: phone,
        updatedAt: serverTimestamp
      }
    }, { merge: true });

    Swal.fire({
      icon: "success",
      title: "User Created Successfully",
      text: `Account for ${name} has been created and saved under admin/login collection.`,
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });

    document.getElementById("createUserForm").reset();

  } catch (error) {
    console.error("Error creating user:", error);
    Swal.fire({
      icon: "error",
      title: "Creation Failed",
      text: error.message || "An error occurred while creating the user account.",
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Create User Account';
  }
}

// ========== INIT ==========
window.addEventListener("DOMContentLoaded", function() {
  initTheme();
  startAdminListener();
});
</script>

</body>
</html>
